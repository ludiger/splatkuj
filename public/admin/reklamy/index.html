<style>
/* Layout: ad desk — toolbar with counts, then a wrap grid of story previews, each with its own post/story switch, actions and status pill */
:root{
  --bg:#0e0f12; --panel:#16181d; --line:#262a32; --fg:#f2f3f5; --mut:#9aa1ad;
  --amber:#14B47E; --amber2:#45D99B; --on-amber:#03140D; --ok:#3ecf8e; --ok-bg:#12291f;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{width:46px;height:46px;flex:none}
.brand b{font:800 23px/1 'Unbounded',var(--display);letter-spacing:-.04em;display:block}
.brand b i{font-style:normal;color:#16B57F}
.brand small{font:600 10px/1 var(--body);letter-spacing:.2em;color:var(--mut);display:block;margin-top:6px}
h1{font:800 clamp(26px,4vw,38px)/1.05 var(--display);font-stretch:112%;margin:0;text-wrap:balance}
.lead{color:var(--mut);margin:6px 0 0;max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:18px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible,.fmt button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#q{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:10px 18px;font:inherit}
.note{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.prev{position:relative;border-radius:14px;overflow:hidden;background:var(--panel);aspect-ratio:4/5;max-width:100%}
.prev img{width:100%;height:100%;object-fit:contain;display:block}
.prev.story{aspect-ratio:9/16}
.fmt{position:absolute;top:8px;left:8px;display:flex;gap:4px;background:rgba(14,15,18,.82);border-radius:999px;padding:3px}
.fmt button{all:unset;cursor:pointer;font:600 12px/1 var(--body);padding:6px 10px;border-radius:999px;color:var(--mut)}
.fmt button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}
.pill{position:absolute;top:8px;right:8px;font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:rgba(14,15,18,.82);color:var(--mut)}
.pill.on{background:var(--ok-bg);color:var(--ok)}
.meta b{display:block;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta span{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font:600 13px/1.2 var(--body);padding:9px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.btn:hover{border-color:var(--mut)}
.btn.main{background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--on-amber);border-color:transparent}
.btn.wide{grid-column:1/-1}
.btn[disabled]{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.empty{color:var(--mut);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.btn,.seg button{transition:background .15s,border-color .15s}}
.pill.sold{background:#3a1519;color:#f0616d}.card.is-sold .prev img{opacity:.45}.card.hl .prev{outline:3px solid var(--amber);outline-offset:3px}
</style>

<style>
.sk-nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:14px 0}
.sk-nav span{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-right:6px}
.sk-nav a{font:600 14px/1 var(--body);text-decoration:none;color:var(--mut);padding:9px 16px;border-radius:999px;border:1px solid var(--line)}
.sk-nav a:hover{color:var(--fg);border-color:var(--mut)}
.sk-nav a[aria-current="page"]{background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--on-amber);border-color:transparent}
.sk-nav a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>

const PHONE = '0903 427 088';
const eur = n => new Intl.NumberFormat('sk-SK',{maximumFractionDigits:0}).format(n) + ' €';
const $ = id => document.getElementById(id);
let status = {}, soldSet = new Set(), filter = 'all', q = '', db = null, dl = null, canWrite = true;
const fmt = {};
const slug = c => (c.t + ' ' + String(c.y).split('/').pop()).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + c.id;
const link = c => `https://splatkuj.sk/#auto-${slug(c)}`;
function caption(c){
  const tag = c.t.split(' ')[0].replace(/[^\p{L}\d]/gu,'').toLowerCase();
  return `🚗 ${c.t} · ${c.y}${c.kw?' · '+c.kw:''} · ${c.km}
${c.w ? c.w + '\n' : ''}
💰 ${eur(c.p)} · 📆 od ${eur(c.m)}/mes. bez akontácie
✅ Akontácia od 0 % · schválenie do 30 min
📑 Podmienka: čisté registre, bez exekúcií

📞 ${PHONE}

#splatkuj #autonasplatky #${tag} #ojazdeneauta`;
}
function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>el.hidden=true,2200); }
function render(){
  const done = c => !!status[c.id];
  const list = CARS.slice().sort((a,b) => soldSet.has(a.id) - soldSet.has(b.id)).filter(c => (filter==='all' || (filter==='done')===done(c)) && (!q || c.t.toLowerCase().includes(q)));
  $('cAll').textContent = CARS.length; $('cDone').textContent = CARS.filter(done).length; $('cNew').textContent = CARS.length - CARS.filter(done).length;
  $('empty').hidden = list.length>0;
  $('grid').innerHTML = list.map(c => {
    const f = fmt[c.id] || 'post', on = done(c);
    return `<article class="card${soldSet.has(c.id)?' is-sold':''}${c.id===hlId?' hl':''}" data-id="${c.id}" id="c${c.id}">
      <div class="prev ${f}"><img loading="lazy" src="t/${c.id}-${f}.jpg" alt="Reklama ${c.t}">
        <div class="fmt"><button type="button" data-fmt="post" aria-pressed="${f==='post'}">Príspevok</button><button type="button" data-fmt="story" aria-pressed="${f==='story'}">Story</button></div>
        <span class="pill ${on?'on':''}${soldSet.has(c.id)?' sold':''}">${soldSet.has(c.id)?'Predané':on?'Zverejnené':'Pripravené'}</span></div>
      <div class="meta"><b>${c.t}</b><span>${eur(c.m)}/mes. · ${eur(c.p)}</span></div>
      <div class="acts">
        <button type="button" class="btn main" data-a="dl" ${dl?'':'disabled'}>Stiahnuť ${f==='post'?'príspevok':'story'}</button>
        <button type="button" class="btn" data-a="copy">Kopírovať text</button>
        <button type="button" class="btn" data-a="vid" ${dl?'':'disabled'}>Stiahnuť video</button>
        <button type="button" class="btn" data-a="link">Kopírovať odkaz</button>
        <button type="button" class="btn wide" data-a="mark" ${db&&canWrite?'':'disabled'}>${on?'Vrátiť medzi pripravené':'Označiť ako zverejnené'}</button>
      </div></article>`;
  }).join('');
}
document.querySelector('.seg').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return;
  filter=b.dataset.f; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
$('q').addEventListener('input', e => { q=e.target.value.trim().toLowerCase(); render(); });
$('grid').addEventListener('click', async e => {
  const card=e.target.closest('.card'); if(!card) return; const c=CARS.find(x=>x.id===card.dataset.id);
  const fb=e.target.closest('[data-fmt]'); if(fb){ fmt[c.id]=fb.dataset.fmt; render(); return; }
  const a=e.target.closest('[data-a]')?.dataset.a; if(!a) return;
  const f=fmt[c.id]||'post';
  if(a==='copy'){ const txt=caption(c);
    try{ await navigator.clipboard.writeText(txt); toast('Text skopírovaný'); }
    catch{ const ta=document.createElement('textarea'); ta.value=txt; document.body.append(ta); ta.select(); try{document.execCommand('copy'); toast('Text skopírovaný');}catch{toast('Kopírovanie nefunguje, označ text ručne');} ta.remove(); } }
  if(a==='link'){ try{ await navigator.clipboard.writeText(link(c)); toast('Odkaz skopírovaný'); }catch{ toast(link(c)); } }
  if(a==='vid' && dl){ try{ const blob=await (await fetch(`v/${c.id}.mp4`)).blob();
      await dl.save({filename:`splatkuj-${slug(c).slice(0,60)}.mp4`, data:blob}); }
    catch(err){ if(err?.code!=='declined') toast('Video zatiaľ nie je pripravené'); } }
  if(a==='dl' && dl){ try{ const blob=await (await fetch(`r/${c.id}-${f}.jpg`)).blob();
      await dl.save({filename:`splatkuj-${c.t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40)}-${f}.jpg`, data:blob}); }
    catch(err){ if(err?.code!=='declined') toast('Stiahnutie sa nepodarilo'); } }
  if(a==='mark' && db){ const on=!!status[c.id];
    try{ if(on) await db.doc('reklamy/'+c.id).delete(); else await db.doc('reklamy/'+c.id).set({status:'zverejnena', at:new Date().toISOString()});
      status[c.id]=!on; render(); toast(on?'Vrátené medzi pripravené':'Označené ako zverejnené'); }
    catch(err){ canWrite=false; render(); toast('Zmenu môže uložiť len správca stránky'); } }
});
let jumped = false, hlId = null;
function jump(){ const id = decodeURIComponent(location.hash.slice(1)); if (!id || jumped) return; const el = document.getElementById('c' + id);
  if (!el){ if (CARS.length && !CARS.some(c => c.id === id)) { jumped = true; toast('K tomuto autu ešte reklama nie je'); } return; }
  jumped = true; hlId = id; el.classList.add('hl'); el.scrollIntoView({block:'center'}); }
addEventListener('hashchange', () => { jumped = false; hlId = null; document.querySelectorAll('.card.hl').forEach(x => x.classList.remove('hl')); jump(); });
render(); jump();
(async () => {
  dl = await window.claude?.use?.('downloads') ?? null;
  db = await window.claude?.use?.('db') ?? null;
  if(!db){ $('note').textContent='Stav „Zverejnené“ sa nepodarilo načítať. Obnovte stránku.'; $('note').hidden=false; }
  else { db.collection('inzeraty').onSnapshot(s => { soldSet = new Set(s.docs.map(d => d.data()).filter(r => r.status === 'predany').map(r => String(r.adId))); render(); jump(); }, () => {}); }
  if (db) db.collection('reklamy').onSnapshot(s => { status={}; s.docs.forEach(d=>status[d.id]=true); render(); }, () => {});
  render();
})();
</script>

</body>
